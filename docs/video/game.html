  }
  // Shorts and jersey
  ctx.fillStyle = COLORS[p.team]; rr(-30, -112, 60, 44, 10); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(-30, -86, 60, 4);
  rr(-32, -196, 64, 92, 18); ctx.fillStyle = COLORS[p.team]; ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillRect(-32, -196, 64, 6);
  ctx.font = `800 40px ${COND}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(p.n), 0, -150);
  // Arms: up when shooting or holding the ball high
  const up = p.hands && jump > 20 ? 1 : 0;
  for (const side of [-1, 1]) {
    ctx.save(); ctx.translate(side * 30, -186);
    ctx.rotate(up ? side * -2.6 + face * .2 : side * .25 + Math.sin(phase + side) * .4 * speed);
    ctx.strokeStyle = skin; ctx.lineWidth = 14; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 66); ctx.stroke();
    ctx.restore();
  }
  // Head and hair
  ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(face * 3, -226, 27, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = HAIR[Math.floor(hash(id + 9) * HAIR.length)]; ctx.beginPath(); ctx.arc(face * 3, -232, 27, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(face * 13, -226, 3.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawBall(b) {
  ctx.save(); ctx.translate(b.x, b.y);
  ctx.fillStyle = '#e8762c'; ctx.beginPath(); ctx.arc(0, 0, 21, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#5a2a0e'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(0, 0, 21, 0, Math.PI * 2); ctx.moveTo(-21, 0); ctx.lineTo(21, 0); ctx.moveTo(0, -21); ctx.lineTo(0, 21); ctx.stroke();
  ctx.beginPath(); ctx.arc(-26, 0, 17, -.9, .9); ctx.stroke(); ctx.beginPath(); ctx.arc(26, 0, 17, Math.PI - .9, Math.PI + .9); ctx.stroke();
  ctx.restore();
}
function drawBug(g, st) {
  // Score bug in the app's style: team bars, scores, quarter clock.
  const x = 48, y = 40;
  ctx.fillStyle = 'rgba(16,17,19,.94)'; rr(x, y, 620, 96, 6); ctx.fill();
  ctx.strokeStyle = '#4b4d52'; ctx.lineWidth = 2; ctx.stroke();
  const row = (team, short, score, cx) => {
    ctx.fillStyle = COLORS[team]; ctx.fillRect(cx, y + 18, 8, 60);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.font = `700 40px ${COND}`; ctx.fillText(short, cx + 22, y + 48);
    const bump = st.lastScore && st.lastScore.team === team ? clamp(1 - (g - st.lastScore.t) / 2, 0, 1) : 0;
    ctx.font = `800 ${60 + bump * 12}px ${COND}`; ctx.fillStyle = bump > 0 ? '#fff4d6' : '#fff'; ctx.textAlign = 'right'; ctx.fillText(String(score), cx + 168, y + 50);
  };
  row('away', AWAY.short, st.away, x + 20); row('home', HOME.short, st.home, x + 210);
  ctx.fillStyle = '#26272a'; ctx.fillRect(x + 410, y + 10, 196, 76);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = `700 36px ${COND}`; ctx.fillText(g >= END_G ? 'END Q1' : `Q1 ${clock(g)}`, x + 508, y + 40);
  ctx.font = `600 20px ${COND}`; ctx.fillStyle = '#ff5a63'; ctx.fillText('REPLAY · 4×', x + 508, y + 70);
  ctx.textAlign = 'right'; ctx.font = `700 26px ${COND}`; ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.fillText('FICTIONAL TEAMS', W - 48, 72);
  drawMark(W - 260 - 24, 72, .7, '#f51825');
}
function drawTicker(g, st) {
  ctx.fillStyle = '#101113'; ctx.fillRect(0, FLOOR_BOT, W, H - FLOOR_BOT);
  ctx.fillStyle = '#c8102e'; ctx.fillRect(0, FLOOR_BOT, W, 4);
  if (!st.last) return;
  const age = g - st.last.t, a = clamp(age / 1.2, 0, 1);
  ctx.globalAlpha = a; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.font = `800 30px ${COND}`; ctx.fillStyle = '#ff5a63'; ctx.fillText(st.last.type === 'score' ? 'SCORE' : 'PLAY', 48, 1042);
  ctx.font = `600 32px ${SANS}`; ctx.fillStyle = '#fff'; ctx.fillText(st.last.text, 170 - (1 - a) * 20, 1042);
  ctx.globalAlpha = 1;
}
function drawCallout(g, st) {
  const e = st.lastScore; if (!e) return;
  const age = g - e.t; if (age > 6) return;
  const k = shotKind(e);
  const word = { three: 'THREE!', dunk: 'SLAM!', ft: 'FREE THROW', jumper: 'BUCKET!', layup: 'BUCKET!' }[k];
  const pop = age < 1 ? 1 - Math.pow(1 - age, 3) : 1, fade = clamp((6 - age) / 1.2, 0, 1);
  const p = PLAYERS[e.playerId];
  ctx.save(); ctx.globalAlpha = fade; ctx.translate(960, 250); ctx.scale(.6 + .4 * pop, .6 + .4 * pop); ctx.rotate(-.04);
  ctx.font = `800 150px ${COND}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(word).width + 80;
  ctx.fillStyle = COLORS[e.team]; ctx.beginPath(); ctx.moveTo(-w / 2 + 30, -84); ctx.lineTo(w / 2 + 30, -84); ctx.lineTo(w / 2 - 30, 84); ctx.lineTo(-w / 2 - 30, 84); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#101113'; ctx.fillText(word, 6, 8); ctx.fillStyle = '#fff'; ctx.fillText(word, 0, 2);
  ctx.font = `700 44px ${COND}`; ctx.fillStyle = '#fff';
  ctx.fillText(`${(p?.nickname || p?.name || '').toUpperCase()} · +${e.points}`, 0, 132);
  ctx.restore();
}
function drawEnd(g, st) {
  if (g < END_G) return;
  const a = clamp((g - END_G) / 1.5, 0, 1);
  ctx.globalAlpha = a; ctx.fillStyle = 'rgba(16,17,19,.82)'; rr(560, 300, 800, 300, 8); ctx.fill();
  ctx.fillStyle = '#c8102e'; ctx.fillRect(560, 300, 800, 8);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
  ctx.font = `700 40px ${COND}`; ctx.fillText('END OF THE FIRST QUARTER', 960, 370);
  ctx.font = `800 120px ${COND}`; ctx.fillText(`${AWAY.short} ${st.away} · ${st.home} ${HOME.short}`, 960, 480);
  ctx.font = `500 30px ${SANS}`; ctx.fillStyle = '#bfc2c8'; ctx.fillText('Calls resolve on the server’s clock', 960, 562);
  ctx.globalAlpha = 1;
}

function frame(ms) {
  const g = ms / 1000 * SPEED;
  const st = state(g);
  const now = layout(g); layout._last = now.ball;
  const before = layout(Math.max(0, g - .25));
  ctx.clearRect(0, 0, W, H);
  drawArena(g, st);
  drawHoop('away', g, st); drawHoop('home', g, st);
  const order = now.players.map((p, i) => [p, before.players[i]]).sort((a, b) => a[0].y - b[0].y);
  for (const [p, prev] of order) drawPlayer(p, g, prev);
  drawBall(now.ball);
  drawCallout(g, st);
  drawBug(g, st);
  drawTicker(g, st);
  drawEnd(g, st);
}

const params = new URLSearchParams(location.search);
const SCENES = [{ id: 'game', overlay: false, dur: DUR, hold: 28000 }];
document.fonts.load(`800 40px ${COND}`).then(() => document.fonts.ready).then(() => {
  if (params.get('render') === '1') { frame(0); window.__scene = { dur: DUR, hold: 28000, seek: (ms) => frame(ms) }; return; }
  const t0 = performance.now();
  const loop = (now) => { frame((now - t0) % DUR); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
});
</script>
</body>
